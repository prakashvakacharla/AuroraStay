services:
  backend:
    build: ./backend_files
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      EVAL_MODEL: ${EVAL_MODEL:-gpt-4o}
    ports:
      - "127.0.0.1:7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
  frontend:
    build: ./frontend_files
    environment:
      BACKEND_URL: http://backend:7860
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
